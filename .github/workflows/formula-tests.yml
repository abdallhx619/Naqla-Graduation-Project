name: formula-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser (config check only)
        run: pip install pyyaml
      - name: Vectors are up to date
        run: |
          python reference/build_vectors.py
          git diff --exit-code tests/vectors/
      - name: Run formula tests
        run: python reference/test_naqla_calc.py
